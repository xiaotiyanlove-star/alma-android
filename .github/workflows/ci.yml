name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # a tag push is what publishes a Release
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (without leading v)
        required: true
        type: string

# Read-only by default; only the publishing job widens it, and only for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, types, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

      # The unit tests cannot see a layout that broke or a dialog that stopped
      # opening; these drive the real UI. They are part of the required check
      # so a regression in one feature cannot ship behind a green build.
      - name: Install a browser for the UI checks
        run: npx playwright install --with-deps chromium

      - name: UI checks
        run: |
          set -euo pipefail
          npm run dev &
          for _ in $(seq 1 40); do
            curl -sf -o /dev/null http://127.0.0.1:5174/ && break
            sleep 1
          done
          npx tsx client-tests/all.ts --skip-build

  android:
    name: Debug APK
    needs: check
    # A tag run publishes its own APK; building a second one here is wasted work.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          test -n "$tag" || { echo "release tag missing" >&2; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # variables.gradle pins compileSdk/targetSdk to 36, so both the platform
      # and matching build-tools must be installed; the runner image does not
      # ship them.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./android/gradlew -p android assembleDebug

      # The APK is debug-signed with the throwaway Android debug key, so it
      # installs but is not suitable for distribution. It is here so a change
      # can be tried on a phone without a local toolchain.
      - uses: actions/upload-artifact@v4
        with:
          name: alma-herdr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publishing needs `contents: write` to create the Release. Scoped to this job
  # only; the build jobs above stay read-only.
  android-release:
    name: Publish APK (tags only)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Only tag pushes can create a Release. A manual run is available for
      # debugging a tag without accidentally replacing the Release asset.
      RELEASE_TAG: v${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.release_tag) || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci

      # A tag that disagrees with the version baked into the APK is how you ship
      # a "0.1.16" download that installs over itself as 0.1.15 and never
      # updates. Both files must agree, and both must match the tag.
      - name: Check the tag matches the build version
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          pkg="$(node -p "require('./package.json').version")"
          gradle="$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
          echo "tag=$tag package.json=$pkg build.gradle=$gradle"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg" >&2; exit 1; }
          test "$pkg" = "$gradle" || { echo "package.json $pkg != build.gradle $gradle" >&2; exit 1; }

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Prepare signing key
        id: signing
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          store="$RUNNER_TEMP/keystore/release.jks"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$store"
            echo "configured keystore bytes: $(wc -c < "$store")"
            file "$store" || true
          if keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -v > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            echo "keytool: keystore password accepted"
            else
              echo "keytool: configured keystore was rejected"
              sed -E 's/(password|密码)[^ ]*/[redacted]/Ig' "$RUNNER_TEMP/keytool.txt" | tail -12
              rm -f "$store"
            fi
          fi
          if [ ! -s "$store" ]; then
            echo "No release keystore was provided." >&2
            exit 1
          fi
          # The alias must have a private key for an APK release, and a JKS key
          # can have its own key password. Read the alias list without
          # exposing it, then prove both passwords before Gradle runs.
          echoes="$(keytool -list -keystore "$store" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null | tail -n +2)"
          aliases="$(printf '%s\n' "$echoes" | sed -n 's/^\(.*\), [A-Za-z0-9 ]*,.*$/\1/p')"
          count="$(printf '%s\n' "$aliases" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" -ne 1 ]; then
            echo "keystore contains $count aliases; expected exactly one" >&2
            exit 1
          fi
          actual_alias="$(printf '%s\n' "$aliases" | sed -n '1p')"
          echo "keystore alias: $actual_alias"
          if keytool -list -keystore "$store" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$actual_alias" -keypass "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" >/dev/null 2>&1; then
            echo "key password accepted"
          else
            echo "key password rejected" >&2
            exit 1
          fi
          echo "ANDROID_KEY_ALIAS=$actual_alias" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build signed release APK
        env:
          ALMA_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.jks
          ALMA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALMA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALMA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease

      # Android refuses to install an APK with no signature at all, so this
      # guards against a misconfigured signingConfig shipping a broken file.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"
          apk=$(find android/app/build/outputs/apk/release -name 'app-release.apk' | head -1)
          test -n "$apk" || { echo "no release APK produced" >&2; exit 1; }
          apksigner verify --verbose --print-certs "$apk"

      - name: Collect APK
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          src=$(find android/app/build/outputs/apk/release -name 'app-release.apk' | head -1)
          name="alma-android-${tag}.apk"
          mkdir -p dist
          cp "$src" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      # A public Release asset: no login, no expiry, unlike an Actions artifact.
      - name: Create release
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/${APK_NAME}#Android APK" \
            "dist/${APK_NAME}.sha256#SHA-256 checksum" \
            --title "$RELEASE_TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: alma-herdr-apk
          path: dist/*
          if-no-files-found: error
