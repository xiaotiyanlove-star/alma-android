name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # a tag push is what publishes a Release
  pull_request:
  workflow_dispatch:

# Read-only by default; only the publishing job widens it, and only for itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests, types, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    name: Debug APK
    needs: check
    # A tag run publishes its own APK; building a second one here is wasted work.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      # variables.gradle pins compileSdk/targetSdk to 36, so both the platform
      # and matching build-tools must be installed; the runner image does not
      # ship them.
      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: ./android/gradlew -p android assembleDebug

      # The APK is debug-signed with the throwaway Android debug key, so it
      # installs but is not suitable for distribution. It is here so a change
      # can be tried on a phone without a local toolchain.
      - uses: actions/upload-artifact@v4
        with:
          name: alma-herdr-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publishing needs `contents: write` to create the Release. Scoped to this job
  # only; the build jobs above stay read-only.
  android-release:
    name: Publish APK (tags only)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - run: npm ci

      - name: Build web application
        run: npm run build:web

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode \
            > "$RUNNER_TEMP/keystore/release.jks"

      # With a keystore: a properly signed release APK, which is what lets users
      # upgrade in place across versions. Without one: the debug APK, which
      # installs fine but is signed with the public debug key. An unsigned
      # `assembleRelease` output would install nowhere, so it is never shipped.
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ALMA_RELEASE_STORE_FILE: ${{ runner.temp }}/keystore/release.jks
          ALMA_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALMA_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ALMA_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./android/gradlew -p android assembleRelease

      - name: Build debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::notice::No keystore configured; publishing a debug-signed APK."
          ./android/gradlew -p android assembleDebug

      # Android refuses to install an APK with no signature at all, so this
      # guards against a misconfigured signingConfig shipping a broken file.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          if [ "$HAS_KEYSTORE" = "true" ]; then
            apk=$(find android/app/build/outputs/apk/release -name 'app-release.apk' | head -1)
            kind=release
          else
            apk=$(find android/app/build/outputs/apk/debug -name 'app-debug.apk' | head -1)
            kind=debug
          fi
          test -n "$apk" || { echo "no $kind APK produced" >&2; exit 1; }
          apksigner verify --verbose --print-certs "$apk"

      - name: Collect APK
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "$HAS_KEYSTORE" = "true" ]; then
            src=$(find android/app/build/outputs/apk/release -name 'app-release.apk' | head -1)
            name="alma-android-${tag}.apk"
          else
            src=$(find android/app/build/outputs/apk/debug -name 'app-debug.apk' | head -1)
            name="alma-android-${tag}-debug.apk"
          fi
          mkdir -p dist
          cp "$src" "dist/$name"
          ( cd dist && sha256sum "$name" > "$name.sha256" )
          echo "APK_NAME=$name" >> "$GITHUB_ENV"

      # A public Release asset: no login, no expiry, unlike an Actions artifact.
      - name: Create release
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/${APK_NAME}#Android APK" \
            "dist/${APK_NAME}.sha256#SHA-256 checksum" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: alma-herdr-apk
          path: dist/*
          if-no-files-found: error
