apply plugin: 'com.android.application'

// Release signing comes from the environment, never from the repository: CI
// decodes the keystore from secrets, and a local release run sets the same four
// variables. With any of them missing the config is skipped and `assembleRelease`
// produces an unsigned APK, which the CI verification step rejects on purpose.
def signingValue = { String envName, String propName ->
    System.getenv(envName) ?: (project.hasProperty(propName) ? project.property(propName) : null)
}
def releaseStore = signingValue('ALMA_RELEASE_STORE_FILE', 'almaReleaseStoreFile')
def releaseStorePassword = signingValue('ALMA_RELEASE_STORE_PASSWORD', 'almaReleaseStorePassword')
def releaseAlias = signingValue('ALMA_RELEASE_KEY_ALIAS', 'almaReleaseKeyAlias')
def releaseKeyPassword = signingValue('ALMA_RELEASE_KEY_PASSWORD', 'almaReleaseKeyPassword')
def hasReleaseSigning = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it }

android {
    namespace "local.almaandroid.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "local.almaandroid.herdr"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "0.1.24"
        // The launcher label, as a placeholder so the development build can
        // name itself without duplicating the whole manifest.
        manifestPlaceholders = [almaLabel: "@string/app_name"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        /**
         * A build that sits beside the release instead of replacing it.
         *
         * Installing over an existing copy is the normal way an Android app
         * works, so testing a change meant uninstalling first and losing every
         * pairing. A distinct application id makes the two siblings: Android
         * treats them as separate apps, keeps both installed, and never
         * compares their signatures. The suffix also keeps the debug build from
         * ever being offered as an update to the real one.
         *
         * The pairing link scheme is deliberately *not* changed. `alma://connect`
         * is the credential's carrier and is validated in exactly one place
         * (`parsePairing`); giving the development build its own scheme would
         * mean a second place deciding what a valid pairing link looks like.
         * The cost is that Android asks which app should open a pairing QR code
         * when both are installed, which is the honest question to ask.
         */
        debug {
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
            manifestPlaceholders = [almaLabel: "@string/app_name_dev"]
        }
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // MainActivity 的 documentStart locale 注入（WebViewCompat.addDocumentStartJavaScript）
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
